name: Build Android app (試用版)

# app/（App Store・Google Play 版）の Android の試用版（APK）を作る。
# 出来上がった APK は、このワークフローの実行結果の「Artifacts」からダウンロードできる。
# Firebase の設定ファイル（app/android/app/google-services.json）が無いあいだは、作らずに終わる。
on:
  push:
    branches-ignore: [main]
    paths: ['app/**', 'index.html', 'icons/**', '.github/workflows/build-android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase config
        id: cfg
        run: |
          if [ -f android/app/google-services.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::warning::app/android/app/google-services.json がまだ無いので、APK は作りません（README の手順1）"; fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: actions/setup-java@v4
        if: steps.cfg.outputs.ok == 'true'
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        if: steps.cfg.outputs.ok == 'true'
      - name: Build APK
        if: steps.cfg.outputs.ok == 'true'
        run: |
          npm ci
          npm run web
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          name: osakenomitai-android-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
