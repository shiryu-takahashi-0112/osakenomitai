<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>オサケノミタイ地図 | 酒場ガイド</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --white: #ffffff;
    --ink: #121212;
    --main: #F2C600;
    --surface-soft: #f7f7f5;
    --line: rgba(18,18,18,0.12);
    --muted: rgba(18,18,18,0.55);
    --muted-2: rgba(18,18,18,0.38);
    --sheet-peek: 96px;
    --sheet-mid: 46vh;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--white);font-family:'Zen Kaku Gothic New', sans-serif;color:var(--ink);overscroll-behavior:none;}
  body{overflow:hidden;position:fixed;inset:0;width:100%;}

  .app{position:fixed;inset:0;height:100%;}

  /* ---------- Map layer (full screen) ---------- */
  #map{position:absolute;inset:0;background:var(--surface-soft);}
  .leaflet-popup-content-wrapper{background:var(--white);color:var(--ink);border-radius:12px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(18,18,18,0.14);}
  .leaflet-popup-tip{background:var(--white);border:1px solid var(--line);}
  .leaflet-popup-content{margin:12px 14px;font-family:'Zen Kaku Gothic New',sans-serif;}
  .leaflet-container a.leaflet-popup-close-button{color:var(--muted);}
  .popup-title{font-family:'Zen Kaku Gothic New',sans-serif;font-weight:700;font-size:15px;margin-bottom:2px;color:var(--ink);}
  .popup-area{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .popup-row{font-size:12px;color:var(--muted);margin:2px 0;}
  .popup-link{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--main);}
  .leaflet-control-zoom{display:none;}
  .leaflet-control-attribution{background:rgba(255,255,255,0.75) !important;font-size:9px !important;}

  /* ---------- Top bar (floating, minimal) ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:900;
    padding:calc(10px + var(--safe-t)) 12px 10px;
    background:linear-gradient(180deg, rgba(255,255,255,0.97) 0%, rgba(255,255,255,0.85) 65%, rgba(255,255,255,0) 100%);
    pointer-events:none;
  }
  .topbar-row{display:flex;align-items:center;gap:10px;pointer-events:auto;}
  .brand{display:flex;align-items:center;gap:7px;flex-shrink:0;}
  .logo-mark{width:104px;height:auto;flex-shrink:0;color:var(--ink);}
  .logo-mark path{fill:currentColor;}

  .search-box{flex:1;position:relative;min-width:0;}
  .search-box input{
    width:100%;background:var(--white);
    border:1px solid var(--line);border-radius:22px;padding:10px 16px 10px 34px;
    color:var(--ink);font-family:inherit;font-size:14px;outline:none;
    box-shadow:0 1px 3px rgba(18,18,18,0.08);
  }
  .search-box input::placeholder{color:var(--muted-2);}
  .search-box input:focus{border-color:var(--main);box-shadow:0 0 0 3px rgba(242,198,0,0.25);}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:0.55;pointer-events:none;}

  .locate-btn, .filter-btn, .menu-btn{
    flex-shrink:0;width:38px;height:38px;border-radius:50%;
    background:var(--white);
    border:1px solid var(--line);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 1px 3px rgba(18,18,18,0.08);
    position:relative;
  }
  .locate-btn svg, .filter-btn svg, .menu-btn svg{width:19px;height:19px;}
  .filter-btn.has-filter{border-color:var(--main);}
  .filter-dot{
    position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;
    background:var(--main);border:1.5px solid var(--white);display:none;
  }
  .filter-btn.has-filter .filter-dot{display:block;}

  /* ---------- Filter modal (area / genre) ---------- */
  .filter-backdrop{
    position:absolute;inset:0;z-index:1180;background:rgba(18,18,18,0.35);
    opacity:0;pointer-events:none;transition:opacity 0.25s;
  }
  .filter-backdrop.open{opacity:1;pointer-events:auto;}
  .filter-modal{
    position:absolute;left:0;right:0;bottom:0;z-index:1190;
    background:var(--white);border-radius:20px 20px 0 0;
    box-shadow:0 -8px 30px rgba(18,18,18,0.2);
    padding:18px 20px calc(20px + var(--safe-b));
    transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .filter-modal.open{transform:translateY(0);}
  .filter-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .filter-modal-header h3{margin:0;font-size:17px;font-weight:900;}
  .filter-modal-close{
    width:30px;height:30px;border-radius:50%;background:var(--surface-soft);border:none;
    color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .filter-section{margin-bottom:20px;}
  .filter-section-label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:9px;}
  .filter-area-select{
    width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface-soft);color:var(--ink);
    font-family:inherit;font-size:14px;outline:none;
  }
  .filter-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    display:flex;align-items:center;gap:5px;
    padding:9px 16px;border-radius:18px;border:1px solid var(--line);
    background:var(--surface-soft);
    color:var(--ink);font-size:13px;font-weight:500;
    white-space:nowrap;
  }
  .chip.active{background:var(--main);color:var(--ink);border-color:var(--main);font-weight:700;}
  .filter-actions{display:flex;gap:10px;margin-top:4px;}
  .filter-reset{
    padding:13px 18px;border-radius:14px;border:1px solid var(--line);background:var(--white);
    color:var(--muted);font-size:13.5px;font-weight:700;
  }
  .filter-apply{
    flex:1;padding:13px 18px;border-radius:14px;border:none;background:var(--main);
    color:var(--ink);font-size:13.5px;font-weight:700;
  }

  /* ---------- Menu panel ---------- */
  .menu-backdrop{
    position:absolute;inset:0;z-index:1180;background:rgba(18,18,18,0.35);
    opacity:0;pointer-events:none;transition:opacity 0.25s;
  }
  .menu-backdrop.open{opacity:1;pointer-events:auto;}
  .menu-panel{
    position:absolute;left:0;right:0;bottom:0;z-index:1190;
    background:var(--white);border-radius:20px 20px 0 0;
    box-shadow:0 -8px 30px rgba(18,18,18,0.2);
    padding:18px 20px calc(20px + var(--safe-b));
    transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
  }
  .menu-panel.open{transform:translateY(0);}
  .menu-login-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--white);
    color:var(--ink);font-size:14px;font-weight:700;margin-bottom:16px;
  }
  .menu-list{display:flex;flex-direction:column;}
  .menu-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 2px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);font-weight:500;
  }
  .menu-item-badge{font-size:11px;color:var(--muted-2);font-weight:500;}
  .menu-item.clickable{cursor:pointer;}
  .menu-item-arrow{color:var(--muted-2);font-size:12px;margin-left:4px;}

  .menu-user{display:flex;align-items:center;gap:10px;padding:8px 2px 16px;margin-bottom:4px;border-bottom:1px solid var(--line);}
  .menu-user-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;background:var(--surface-soft);border:1px solid var(--line);object-fit:cover;}
  .menu-user-name{flex:1;font-size:14px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menu-logout-btn{flex-shrink:0;font-size:12px;color:var(--muted);font-weight:700;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--white);}

  .menu-list-view-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .menu-list-back{
    width:30px;height:30px;border-radius:50%;background:var(--surface-soft);border:none;
    color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
  }
  .menu-list-view-title{font-size:16px;font-weight:900;color:var(--ink);}
  .menu-list-items{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .menu-list-empty{padding:34px 10px;text-align:center;color:var(--muted-2);font-size:13px;}
  .menu-shop-item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);}
  .menu-shop-item-name{flex:1;font-size:13.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .menu-shop-item-area{font-size:11px;color:var(--muted);flex-shrink:0;}

  /* ---------- Save (favorite) button ---------- */
  .save-btn{
    flex-shrink:0;border-radius:50%;background:var(--white);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  }
  .save-btn svg{display:block;}
  .save-btn.saved{border-color:var(--main);}
  .card-save-btn{width:30px;height:30px;}
  .card-save-btn svg{width:16px;height:16px;}
  .detail-save-btn{width:34px;height:34px;flex-shrink:0;}
  .detail-save-btn svg{width:18px;height:18px;}

  /* ---------- Bottom sheet ---------- */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:950;
    height:88vh;
    background:var(--white);
    border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -8px 30px rgba(18,18,18,0.16);
    transform:translateY(calc(88vh - var(--sheet-peek) - var(--safe-b)));
    transition:transform 0.32s cubic-bezier(0.22,1,0.36,1);
    display:flex;flex-direction:column;
    touch-action:none;
  }
  .sheet.dragging{transition:none;}
  .sheet.state-mid{transform:translateY(calc(88vh - var(--sheet-mid) - var(--safe-b)));}
  .sheet.state-full{transform:translateY(0);}
  .sheet.state-peek{transform:translateY(calc(88vh - var(--sheet-peek) - var(--safe-b)));}

  .sheet-handle-area{
    flex-shrink:0;padding:10px 16px 8px;cursor:grab;
  }
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 10px;}
  .sheet-summary{display:flex;align-items:center;justify-content:space-between;}
  .sheet-summary-text{font-size:13px;color:var(--muted);}
  .sheet-summary-text b{color:var(--ink);font-size:16px;font-weight:900;}
  .sort-select{
    background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;
    color:var(--ink);font-family:inherit;font-size:11.5px;padding:5px 10px;outline:none;
  }

  .sheet-list{
    flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 12px calc(20px + var(--safe-b));
  }

  .shop-card{
    display:flex;gap:12px;padding:12px 8px;border-bottom:1px solid var(--line);
  }
  .shop-card:active{background:var(--surface-soft);}
  .card-badge{
    flex-shrink:0;width:44px;height:44px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:var(--surface-soft);border:1px solid var(--line);
  }
  .card-body{flex:1;min-width:0;}
  .card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  .card-name{font-weight:700;font-size:15.5px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-area{flex-shrink:0;font-size:11px;color:var(--muted);}
  .card-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card-meta{display:flex;gap:10px;margin-top:5px;flex-wrap:wrap;}
  .card-meta span{font-size:11px;color:var(--muted-2);display:flex;align-items:center;gap:3px;}

  .empty-state{padding:40px 20px;text-align:center;color:var(--muted-2);font-size:13px;}

  /* ---------- Shop detail panel (slides over sheet) ---------- */
  .detail{
    position:absolute;inset:0;z-index:1100;background:var(--white);
    transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
    display:flex;flex-direction:column;
  }
  .detail.open{transform:translateY(0);}
  .detail-header{
    flex-shrink:0;display:flex;align-items:center;gap:10px;
    padding:calc(14px + var(--safe-t)) 16px 12px;border-bottom:1px solid var(--line);
  }
  .back-btn{
    width:34px;height:34px;border-radius:50%;background:var(--surface-soft);border:1px solid var(--line);
    color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  }
  .detail-header-title{flex:1;font-weight:700;font-size:16px;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px calc(30px + var(--safe-b));}
  .detail-cat{
    display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:14px;
    font-size:11.5px;font-weight:700;margin-bottom:10px;
    background:var(--surface-soft);border:1px solid var(--line);color:var(--ink);
  }
  .detail-name{font-weight:900;font-size:22px;margin:0 0 4px;line-height:1.35;color:var(--ink);}
  .detail-area{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .detail-desc{font-size:14px;line-height:1.7;color:var(--ink);margin-bottom:20px;}
  .info-grid{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--line);}
  .info-row{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);}
  .info-icon{flex-shrink:0;width:20px;text-align:center;font-size:15px;opacity:0.85;}
  .info-label{flex-shrink:0;width:56px;font-size:11.5px;color:var(--muted-2);padding-top:1px;}
  .info-value{flex:1;font-size:13.5px;color:var(--ink);line-height:1.5;}
  .detail-actions{display:flex;gap:10px;margin-top:22px;}
  .btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:13px;border-radius:14px;font-size:13.5px;font-weight:700;
    text-decoration:none;border:1px solid var(--line);
  }
  .btn-primary{background:var(--main);color:var(--ink);border-color:var(--main);}
  .btn-secondary{background:var(--white);color:var(--ink);}

  /* Leaflet marker */
  .lantern-marker{transition:transform 0.15s;}

  /* ---------- Loading splash (animated) ---------- */
  .splash{
    position:absolute;inset:0;z-index:2000;background:var(--white);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity 0.4s;
  }
  .splash.hide{opacity:0;pointer-events:none;}
  .splash-visual{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
  .splash-ring{
    position:absolute;inset:0;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--main);
    animation:splashSpin 1.1s linear infinite;
  }
  .splash-ring.ring2{inset:14px;border-width:2px;border-top-color:transparent;border-right-color:var(--main);opacity:0.5;animation-duration:1.7s;animation-direction:reverse;}
  .splash .logo-mark{width:104px;position:relative;z-index:1;color:var(--ink);animation:splashPulse 1.6s ease-in-out infinite;}
  .splash-dots{display:flex;gap:6px;}
  .splash-dots span{width:6px;height:6px;border-radius:50%;background:var(--main);animation:splashDot 1.2s ease-in-out infinite;}
  .splash-dots span:nth-child(2){animation-delay:0.15s;}
  .splash-dots span:nth-child(3){animation-delay:0.3s;}
  .splash p{font-size:13px;color:var(--muted);letter-spacing:0.1em;margin:0;}
  @keyframes splashSpin{to{transform:rotate(360deg);}}
  @keyframes splashPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  @keyframes splashDot{0%,80%,100%{transform:translateY(0);opacity:0.25;}40%{transform:translateY(-6px);opacity:1;}}

  @media (min-width:640px){
    .app{max-width:480px;margin:0 auto;box-shadow:0 0 60px rgba(18,18,18,0.18);}
    body{background:#ececea;}
  }
</style>
</head>

  <div id="map"></div>

    <div class="topbar-row">

const CAT_META = {
  izakaya: {label:'居酒屋', icon:'🏮'},
  sakaya:  {label:'角打ち・酒屋', icon:'🍶'},
  bar:     {label:'バー', icon:'🍸'}
};

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Save (favorite) heart icon ---------- */
function heartSvg(saved){
  const fill = saved ? '#F2C600' : 'none';
  return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 21C12 21 4 15.36 4 9.5C4 6.94 6.02 5 8.5 5C10.06 5 11.44 5.83 12 7.09C12.56 5.83 13.94 5 15.5 5C17.98 5 20 6.94 20 9.5C20 15.36 12 21 12 21Z" fill="${fill}" stroke="#121212" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

/* ---------- Map init ---------- */
const map = L.map('map', {zoomControl:false, attributionControl:false, tap:true}).setView([35.68, 139.72], 12);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom: 18, maxNativeZoom: 18
}).addTo(map);
L.control.attribution({position:'bottomleft', prefix:false}).addAttribution('地理院タイル(国土地理院)').addTo(map);

function lanternIcon(){
  const w = 24, h = 30;
  const color = '#F2C600', outline = '#121212';
  const html = `
    <svg width="${w}" height="${h}" viewBox="0 0 24 30" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;">
      <path d="M12 1C6.48 1 2 5.36 2 10.7c0 7.1 10 17.3 10 17.3s10-10.2 10-17.3C22 5.36 17.52 1 12 1z" fill="${color}" stroke="${outline}" stroke-width="1.6"/>
      <circle cx="12" cy="10.7" r="3.4" fill="${outline}"/>
    </svg>`;
  return L.divIcon({
    html: html, className: 'lantern-marker',
    iconSize: [w, h], iconAnchor: [w/2, h-1], popupAnchor: [0, -(h-4)]
  });
}
const SHARED_ICON = lanternIcon();

const markers = {};
SHOPS.forEach(s => {
  const marker = L.marker([s.lat, s.lng], {icon: SHARED_ICON});
  marker.on('click', () => openDetail(s.id));
  markers[s.id] = marker;
});

const clusterLayer = L.layerGroup(Object.values(markers)).addTo(map);

/* ---------- Areas ---------- */
const areas = [...new Set(SHOPS.map(s=>s.area).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
const areaSelect = document.getElementById('areaSelect');
areas.forEach(a=>{
  const opt = document.createElement('option');
  opt.value = a; opt.textContent = a;
  areaSelect.appendChild(opt);
});

/* ---------- State ---------- */
let state = { cat:'all', area:'', q:'', sort:'default' };

function applyFilter(){
  let list = SHOPS.filter(s=>{
    if(state.cat!=='all' && s.cat!==state.cat) return false;
    if(state.area && s.area!==state.area) return false;
    if(state.q){
      const q = state.q.toLowerCase();
      const hay = (s.name+s.area+(s.desc||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(state.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  if(state.sort==='area') list.sort((a,b)=>(a.area||'').localeCompare(b.area||'','ja'));
  return list;
}

function render(){
  const list = applyFilter();

  // markers
  clusterLayer.clearLayers();
  list.forEach(s=> clusterLayer.addLayer(markers[s.id]));

  // counts
  document.getElementById('sheetCount').textContent = list.length;

  // list
  const wrap = document.getElementById('sheetList');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty-state">条件に合う酒場が見つかりませんでした<br>検索条件を変えてみてください</div>`;
    return;
  }
  wrap.innerHTML = list.map(s=>{
    const meta = CAT_META[s.cat]||CAT_META.izakaya;
    let metaBits = '';
    if(s.price) metaBits += `<span>💰 ${escapeHtml(s.price)}</span>`;
    if(s.walk) metaBits += `<span>🚶 ${escapeHtml(s.walk)}</span>`;
    return `
    <div class="shop-card" data-id="${s.id}">
      <div class="card-badge">${meta.icon}</div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${escapeHtml(s.name)}</div>
          <div class="card-area">${escapeHtml(s.area||'')}</div>
        </div>
        <div class="card-desc">${escapeHtml(s.desc || meta.label)}</div>
        <div class="card-meta">${metaBits}</div>
      </div>
      <button class="save-btn card-save-btn${savedIds.has(s.id)?' saved':''}" data-save-id="${s.id}" title="保存">${heartSvg(savedIds.has(s.id))}</button>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.shop-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.save-btn')) return;
      const id = parseInt(card.dataset.id);
      openDetail(id, true);
    });
  });
  wrap.querySelectorAll('.save-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleSave(parseInt(btn.dataset.saveId));
    });
  });
}

/* ---------- Detail panel ---------- */
let currentDetailId = null;
function openDetail(id, flyTo){
  const s = SHOPS.find(x=>x.id===id);
  if(!s) return;
  currentDetailId = s.id;
  const meta = CAT_META[s.cat]||CAT_META.izakaya;
  document.getElementById('detailHeaderTitle').textContent = s.name;
  updateDetailSaveBtn();
  recordHistory(s.id);

  let rows = '';
  if(s.addr) rows += infoRow('📍','住所', s.addr);
  if(s.walk) rows += infoRow('🚶','アクセス', s.walk);
  if(s.price) rows += infoRow('💰','予算', s.price);
  if(s.hours) rows += infoRow('🕐','営業時間', s.hours);
  if(s.closed) rows += infoRow('💤','定休日', s.closed);

  const mapQ = encodeURIComponent(s.addr || s.name);
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-cat">${meta.icon} ${meta.label}</div>
    <h2 class="detail-name">${escapeHtml(s.name)}</h2>
    <div class="detail-area">${escapeHtml(s.area||'')}</div>
    ${s.desc ? `<div class="detail-desc">${escapeHtml(s.desc)}</div>` : ''}
    <div class="info-grid">${rows}</div>
    <div class="detail-actions">
      <a class="btn btn-secondary" href="https://www.google.com/maps/search/?api=1&query=${mapQ}" target="_blank" rel="noopener">🗺️ 地図アプリで開く</a>
      ${s.ig ? `<a class="btn btn-primary" href="${s.ig}" target="_blank" rel="noopener">📷 Instagramで見る</a>` : ''}
    </div>
  `;
  document.getElementById('detail').classList.add('open');

  if(flyTo!==false){
    map.flyTo([s.lat, s.lng], Math.max(map.getZoom(),16), {duration:0.5});
  }
}
function infoRow(icon,label,value){
  return `<div class="info-row"><div class="info-icon">${icon}</div><div class="info-label">${label}</div><div class="info-value">${escapeHtml(value)}</div></div>`;
}
document.getElementById('detailBack').addEventListener('click', ()=>{
  document.getElementById('detail').classList.remove('open');
});
function updateDetailSaveBtn(){
  const btn = document.getElementById('detailSaveBtn');
  if(currentDetailId==null) return;
  const saved = savedIds.has(currentDetailId);
  btn.classList.toggle('saved', saved);
  btn.innerHTML = heartSvg(saved);
}
document.getElementById('detailSaveBtn').addEventListener('click', ()=>{
  if(currentDetailId!=null) toggleSave(currentDetailId);
});

/* ---------- Auth / Save / History (Firebase) ---------- */
function toggleSave(shopId){
  if(!currentUser){
    showToast('保存するにはGoogleでログインしてください');
    return;
  }
  const ref = db.collection('users').doc(currentUser.uid).collection('saved').doc(String(shopId));
  if(savedIds.has(shopId)){
    savedIds.delete(shopId);
    ref.delete().catch(()=>{});
  }else{
    savedIds.add(shopId);
    ref.set({ shopId, savedAt: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
  }
  render();
  updateDetailSaveBtn();
  updateMenuBadges();
}

function recordHistory(shopId){
  if(!currentUser) return;
  db.collection('users').doc(currentUser.uid).collection('history').doc(String(shopId))
    .set({ shopId, viewedAt: firebase.firestore.FieldValue.serverTimestamp() })
    .catch(()=>{});
}

function updateMenuBadges(){
  const savedBadge = document.getElementById('menuSavedBadge');
  const historyBadge = document.getElementById('menuHistoryBadge');
  if(currentUser){
    savedBadge.textContent = savedIds.size > 0 ? `${savedIds.size}件` : '';
    historyBadge.textContent = '';
  }else{
    savedBadge.textContent = 'ログインが必要';
    historyBadge.textContent = 'ログインが必要';
  }
}

let toastTimer;
function showToast(msg){
  let el = document.getElementById('appToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'appToast';
    el.style.cssText = 'position:absolute;left:50%;bottom:calc(100px + var(--safe-b));transform:translate(-50%,10px);background:var(--ink);color:var(--white);font-size:12.5px;font-weight:700;padding:10px 18px;border-radius:20px;z-index:2100;opacity:0;transition:opacity 0.25s, transform 0.25s;pointer-events:none;white-space:nowrap;';
    document.querySelector('.app').appendChild(el);
  }
  el.textContent = msg;
  clearTimeout(toastTimer);
  requestAnimationFrame(()=>{
    el.style.opacity = '1';
    el.style.transform = 'translate(-50%,0)';
  });
  toastTimer = setTimeout(()=>{
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%,10px)';
  }, 2200);
}

function loadUserData(uid){
  savedIds = new Set();
  db.collection('users').doc(uid).collection('saved').get().then(snap=>{
    savedIds = new Set(snap.docs.map(d=> parseInt(d.id)));
    render();
    updateDetailSaveBtn();
    updateMenuBadges();
  }).catch(()=>{});
}

function renderMenuAuthArea(){
  const area = document.getElementById('menuAuthArea');
  if(currentUser){
    const photo = currentUser.photoURL || '';
    area.innerHTML = `
      <div class="menu-user">
        ${photo ? `<img class="menu-user-avatar" src="${photo}" referrerpolicy="no-referrer">` : `<div class="menu-user-avatar"></div>`}
        <div class="menu-user-name">${escapeHtml(currentUser.displayName || currentUser.email || 'ユーザー')}</div>
        <button class="menu-logout-btn" id="menuLogoutBtn">ログアウト</button>
      </div>`;
    document.getElementById('menuLogoutBtn').addEventListener('click', ()=>{
      auth.signOut();
    });
  }else{
    area.innerHTML = `
      <button class="menu-login-btn" id="menuLoginBtn">
        <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#F2C600" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.6H24v9h11.8c-.5 2.7-2 5-4.3 6.6v5.5h7C42.5 37.1 45.1 31.3 45.1 24.5z"/><path fill="#121212" d="M24 46c5.9 0 10.9-2 14.5-5.3l-7-5.5c-2 1.3-4.5 2.1-7.5 2.1-5.8 0-10.7-3.9-12.4-9.2H4.3v5.7C7.9 41.1 15.3 46 24 46z"/><path fill="#121212" opacity=".6" d="M11.6 28.1c-.4-1.3-.7-2.7-.7-4.1s.2-2.8.7-4.1v-5.7H4.3C2.8 17.1 2 20.5 2 24s.8 6.9 2.3 9.8z"/><path fill="#121212" opacity=".3" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.2-6.2C34.9 4.2 29.9 2 24 2 15.3 2 7.9 6.9 4.3 14.2l7.3 5.7c1.7-5.3 6.6-9.2 12.4-9.2z"/></svg>
        Googleでログイン
      </button>`;
    document.getElementById('menuLoginBtn').addEventListener('click', ()=>{
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(()=>{ showToast('ログインできませんでした'); });
    });
  }
}

renderMenuAuthArea();
updateMenuBadges();

auth.onAuthStateChanged(user=>{
  currentUser = user;
  renderMenuAuthArea();
  updateMenuBadges();
  if(user){
    loadUserData(user.uid);
  }else{
    savedIds = new Set();
    historyItems = [];
    render();
    updateDetailSaveBtn();
  }
});

function openMenuList(type){
  const title = document.getElementById('menuListTitle');
  const itemsWrap = document.getElementById('menuListItems');
  title.textContent = type==='saved' ? '保存した酒場' : '閲覧履歴';
  document.getElementById('menuMainView').style.display = 'none';
  document.getElementById('menuListView').style.display = 'block';
  itemsWrap.innerHTML = `<div class="menu-list-empty">読み込み中...</div>`;

  const col = type==='saved' ? 'saved' : 'history';
  const orderField = type==='saved' ? 'savedAt' : 'viewedAt';
  db.collection('users').doc(currentUser.uid).collection(col).orderBy(orderField, 'desc').get().then(snap=>{
    const ids = snap.docs.map(d=> parseInt(d.id));
    const shops = ids.map(id=> SHOPS.find(s=> s.id===id)).filter(Boolean);
    if(shops.length===0){
      itemsWrap.innerHTML = `<div class="menu-list-empty">${type==='saved' ? 'まだ保存した酒場がありません' : 'まだ閲覧履歴がありません'}</div>`;
      return;
    }
    itemsWrap.innerHTML = shops.map(s=>{
      const meta = CAT_META[s.cat]||CAT_META.izakaya;
      return `<div class="menu-shop-item" data-id="${s.id}"><span>${meta.icon}</span><span class="menu-shop-item-name">${escapeHtml(s.name)}</span><span class="menu-shop-item-area">${escapeHtml(s.area||'')}</span></div>`;
    }).join('');
    itemsWrap.querySelectorAll('.menu-shop-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        closeMenuPanel();
        document.getElementById('menuMainView').style.display = '';
        document.getElementById('menuListView').style.display = 'none';
        openDetail(parseInt(item.dataset.id), true);
      });
    });
  }).catch(()=>{
    itemsWrap.innerHTML = `<div class="menu-list-empty">読み込みに失敗しました</div>`;
  });
}
document.getElementById('menuSavedItem').addEventListener('click', ()=>{
  if(!currentUser){ showToast('ログインすると保存した酒場が見られます'); return; }
  openMenuList('saved');
});
document.getElementById('menuHistoryItem').addEventListener('click', ()=>{

  openMenuList('history');
});
document.getElementById('menuListBack').addEventListener('click', ()=>{

});

/* ---------- Bottom sheet drag ---------- */
const sheet = document.getElementById('sheet');
const sheetHandle = document.getElementById('sheetHandle');
const sheetList = document.getElementById('sheetList');
let dragStartY = 0, sheetStartTranslate = 0, dragging = false;
const vh = () => window.innerHeight;

function getSheetTranslateForState(s){
  const sheetH = sheet.offsetHeight;
  const safeB = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-b')) || 0;
  if(s==='peek') return sheetH - 96 - safeB;
  if(s==='mid') return sheetH - (vh()*0.46) - safeB;
  if(s==='full') return 0;
  return sheetH - 96 - safeB;
}
let currentState = 'peek';
function setSheetState(s, animate=true){
  currentState = s;
  sheet.classList.toggle('dragging', !animate);
  sheet.style.transform = `translateY(${getSheetTranslateForState(s)}px)`;
}
setTimeout(()=>setSheetState('peek', false), 50);

function onDragStart(y){
  dragging = true;
  dragStartY = y;
  const tr = sheet.style.transform.match(/-?\d+\.?\d*/);
  sheetStartTranslate = tr ? parseFloat(tr[0]) : getSheetTranslateForState(currentState);
  sheet.classList.add('dragging');
}
function onDragMove(y){
  if(!dragging) return;
  const dy = y - dragStartY;
  let next = sheetStartTranslate + dy;
  next = Math.max(0, Math.min(next, getSheetTranslateForState('peek')));
  sheet.style.transform = `translateY(${next}px)`;
}
function onDragEnd(y){
  if(!dragging) return;
  dragging = false;
  sheet.classList.remove('dragging');
  const dy = y - dragStartY;
  const positions = ['full','mid','peek'];
  const targets = positions.map(p=>({p, v:getSheetTranslateForState(p)}));
  const cur = sheetStartTranslate + dy;
  let nearest = targets[0];
  targets.forEach(t=>{ if(Math.abs(t.v-cur) < Math.abs(nearest.v-cur)) nearest = t; });
  if(Math.abs(dy) > 60){
    const idx = positions.indexOf(currentState);
    if(dy < -60 && idx>0) nearest = targets[idx-1];
    else if(dy > 60 && idx<positions.length-1) nearest = targets[idx+1];
  }
  setSheetState(nearest.p);
}
sheetHandle.addEventListener('touchstart', e=>onDragStart(e.touches[0].clientY), {passive:true});
sheetHandle.addEventListener('touchmove', e=>onDragMove(e.touches[0].clientY), {passive:true});
sheetHandle.addEventListener('touchend', e=>onDragEnd(e.changedTouches[0].clientY));
sheetHandle.addEventListener('mousedown', e=>{
  onDragStart(e.clientY);
  const mv = ev=>onDragMove(ev.clientY);
  const up = ev=>{ onDragEnd(ev.clientY); document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
  document.addEventListener('mousemove',mv);
  document.addEventListener('mouseup',up);
});
sheetHandle.addEventListener('click', ()=>{
  if(currentState==='peek') setSheetState('mid');
});

sheetList.addEventListener('touchstart', ()=>{
  if(currentState==='peek') setSheetState('mid');
}, {passive:true});

window.addEventListener('resize', ()=> setSheetState(currentState, false));

/* ---------- Init ---------- */
render();
setTimeout(()=>{
  document.getElementById('splash').classList.add('hide');
}, 900);
